name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build Apple silicon DMG
        id: package
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}"
          DMG_PATH="$(VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" ./Scripts/package-dmg.sh)"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mend-${{ github.ref_name }}-apple-silicon
          path: ${{ steps.package.outputs.dmg_path }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.dmg_path }}" \
            --title "Mend ${GITHUB_REF_NAME#v}" \
            --generate-notes
