name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build Apple silicon app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" \
          BUILD_NUMBER="$BUILD_NUMBER" \
          TARGET_TRIPLE="arm64-apple-macosx13.0" \
            ./Scripts/build-app.sh

      - name: Package terminal installer archive
        id: app_archive
        run: |
          set -euo pipefail
          archive="dist/Mend-app-aarch64-apple-darwin.tar.gz"
          tar -C dist -czf "$archive" Mend.app
          echo "archive_path=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          set -euo pipefail
          archive_name="$(basename "${{ steps.app_archive.outputs.archive_path }}")"
          (
            cd dist
            shasum -a 256 "$archive_name" > SHA256SUMS
          )

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          archive="${{ steps.app_archive.outputs.archive_path }}"
          tar -tzf "$archive" | grep -qx 'Mend.app/Contents/MacOS/Mend'
          codesign --verify --deep --strict --verbose=2 dist/Mend.app

          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          MEND_APPS_DIR="$install_root/Applications" \
            MEND_APP_ARCHIVE="$archive" \
            sh Scripts/install-app.sh
          codesign --verify --deep --strict --verbose=2 "$install_root/Applications/Mend.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mend-${{ github.ref_name }}-apple-silicon
          path: |
            ${{ steps.app_archive.outputs.archive_path }}
            dist/SHA256SUMS

      - name: Collect release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md, without its heading.
          awk -v v="$version" '
            /^## / { printing = ($2 == v) ; next }
            printing { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/RELEASE_NOTES.md
          if [[ ! -s dist/RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat dist/RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.app_archive.outputs.archive_path }}" \
            dist/SHA256SUMS \
            --title "Mend ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag
